<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#1d2120;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Mirrors the Unity look (Runtime/Rendering): PBR + procedural weathering, time-of-day lighting keyframes
// (overcast day is the reference look), warm practical lamps, drone camera (narrow FOV, high three-quarter),
// soft shadows, AO, bloom, faint sensor grain. No tilt-shift: it reads as a miniature (doc 11).
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';

const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1080, H = +P.get('h') || 1920;
const scene = await (await fetch('/scene.json')).json();
const look = timeOfDay(await (await fetch('/look.json')).json(), P.get('hour') !== null ? +P.get('hour') : 12);

// Blends the lighting keyframes around the game hour into one flat look (same rule as BaseLook.cs).
function timeOfDay(file, hour) {
  const k = file.times;
  let i = 0;
  while (i < k.length - 2 && k[i + 1].hour <= hour) i++;
  const a = k[i], b = k[i + 1], f = Math.min(1, Math.max(0, (hour - a.hour) / Math.max(0.0001, b.hour - a.hour)));
  const mix = (x, y) => Array.isArray(x) ? x.map((v, j) => v + (y[j] - v) * f) : x + (y - x) * f;
  const out = { ...file };
  for (const key of Object.keys(a)) if (key !== 'hour') out[key] = mix(a[key], b[key]);
  // moonlight of this night (?night=N cycles moonPhases; same rule as BaseLook.WithMoon)
  const ph = file.moonPhases || [1], n = +(P.get('night') ?? 3), lvl = ph[((n % ph.length) + ph.length) % ph.length], m = out.moon || 0;
  out.sunIntensity *= 1 + (lvl - 1) * m;
  out.ambient *= 1 + (0.6 + 0.4 * lvl - 1) * m;
  return out;
}

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = (look.shadowSoftness ?? 0) > 0 ? THREE.VSMShadowMap : THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = look.exposure;
document.body.appendChild(renderer.domElement);

const world = new THREE.Scene();
world.background = new THREE.Color().setRGB(...look.fogColor, THREE.SRGBColorSpace);
world.fog = new THREE.FogExp2(world.background.getHex(), look.fogDensity);

// Environment for reflections (wet mud, metal): a dim sky gradient baked to PMREM.
{
  const envScene = new THREE.Scene();
  const sky = new THREE.Mesh(new THREE.SphereGeometry(10, 16, 8), new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { top: { value: new THREE.Color().setRGB(...look.skyColor, THREE.SRGBColorSpace) }, bottom: { value: new THREE.Color().setRGB(...look.groundColor, THREE.SRGBColorSpace) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: 'uniform vec3 top, bottom; varying vec3 vP; void main(){ float h = normalize(vP).y; gl_FragColor = vec4(mix(bottom, top, smoothstep(-0.2, 0.6, h)), 1.); }' }));
  envScene.add(sky);
  world.environment = new THREE.PMREMGenerator(renderer).fromScene(envScene).texture;
  world.environmentIntensity = look.envIntensity ?? 0.5;
}
const hemi = new THREE.HemisphereLight(new THREE.Color().setRGB(...look.skyColor, THREE.SRGBColorSpace), new THREE.Color().setRGB(...look.groundColor, THREE.SRGBColorSpace), look.ambient);
world.add(hemi);
const sun = new THREE.DirectionalLight(new THREE.Color().setRGB(...look.sunColor, THREE.SRGBColorSpace), look.sunIntensity);
const az = THREE.MathUtils.degToRad(look.sunAzimuth), el = THREE.MathUtils.degToRad(look.sunElevation);
sun.position.set(Math.cos(el) * Math.sin(az) * 60, Math.sin(el) * 60, Math.cos(el) * Math.cos(az) * 60);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 160 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
if ((look.shadowSoftness ?? 0) > 0) { sun.shadow.radius = look.shadowSoftness; sun.shadow.blurSamples = 16; sun.shadow.bias = -0.0002; }
world.add(sun);

const salvage = (await (await fetch('/salvage.txt')).text()).replace(/^#(ifndef|define|endif).*$/gm, '');
const shim = '#define float2 vec2\n#define float3 vec3\n#define float4 vec4\n#define lerp mix\n#define frac fract\n#define saturate(x) clamp(x, 0.0, 1.0)\n';
const lin = c => new THREE.Color().setRGB(...c, THREE.SRGBColorSpace);
const coneMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, vertexColors: true,
  uniforms: { col: { value: new THREE.Color(1.0, 0.72, 0.42) }, k: { value: look.coneIntensity ?? 0.07 } },
  vertexShader: 'varying float a; varying vec3 vn; varying vec3 vv; void main(){ a = color.r; vec4 mv = modelViewMatrix * vec4(position,1.); vv = normalize(-mv.xyz); vn = normalize(normalMatrix * normal); gl_Position = projectionMatrix * mv; }',
  fragmentShader: 'uniform vec3 col; uniform float k; varying float a; varying vec3 vn; varying vec3 vv; void main(){ float rim = pow(clamp(abs(dot(normalize(vn), normalize(vv))), 0.0, 1.0), 1.5); gl_FragColor = vec4(col * k * a * a * a * rim * rim, 1.); }' });
const mats = scene.palette.map((p, i) => (powered) => {
  if (p.name === 'LightCone') return powered ? coneMat : new THREE.MeshBasicMaterial({ visible: false });
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 - p.smoothness, metalness: p.metallic, flatShading: false });
  m.color.setRGB(...p.color, THREE.SRGBColorSpace);
  const w = p.wear;
  const procedural = w && (w.chip + w.rust + w.dirt + w.streak + w.bump > 0 || w.ground);
  if (procedural) {
    m.onBeforeCompile = sh => {
      const bare = lin(w.bare);
      Object.assign(sh.uniforms, { dsBare: { value: new THREE.Vector3(bare.r, bare.g, bare.b) }, dsWear: { value: new THREE.Vector4(w.chip, w.rust, w.dirt, w.streak) }, dsBump: { value: new THREE.Vector3(w.bump, w.scale, w.ground ? 1 : 0) } });
      sh.vertexShader = 'varying vec3 dsWp; varying vec3 dsWn;\n' + sh.vertexShader.replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\n dsWp = (modelMatrix * vec4(transformed, 1.0)).xyz; dsWn = normalize(mat3(modelMatrix) * objectNormal);');
      sh.fragmentShader = 'varying vec3 dsWp; varying vec3 dsWn; uniform vec3 dsBare; uniform vec4 dsWear; uniform vec3 dsBump;\n' + shim + salvage + '\n float dsH; float dsR; float dsM;\n' +
        sh.fragmentShader
          .replace('#include <color_fragment>', `vec3 dsAlb; ds_salvage(dsWp, normalize(dsWn), vColor.rgb, diffuseColor.rgb, dsBare, metalness, roughness, dsWear.x, dsWear.y, dsWear.z, dsWear.w, dsBump.x, dsBump.y, dsBump.z, dsAlb, dsR, dsM, dsH); diffuseColor.rgb = dsAlb;`)
          .replace('#include <roughnessmap_fragment>', 'float roughnessFactor = dsR;')
          .replace('#include <metalnessmap_fragment>', 'float metalnessFactor = dsM;')
          .replace('#include <normal_fragment_maps>', `{ vec3 dpdx = dFdx(-vViewPosition), dpdy = dFdy(-vViewPosition); float dhx = dFdx(dsH), dhy = dFdy(dsH);
              vec3 r1 = cross(dpdy, normal), r2 = cross(normal, dpdx); float det = dot(dpdx, r1);
              vec3 g = sign(det) * (dhx * r1 + dhy * r2) * 0.06; vec3 nn = abs(det) * normal - g; if (abs(det) > 1e-12 && dot(nn, nn) > 1e-20) normal = normalize(nn); }`);
    };
    m.customProgramCacheKey = () => 'salvage' + i;
  } else {
    // Vertex colors are masks, not colors: only the AO channel darkens plain materials.
    m.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include <color_fragment>', 'diffuseColor.rgb *= vColor.r;'); };
    m.customProgramCacheKey = () => 'plain' + i;
  }
  if (p.emissionIntensity > 0 && (powered || !p.lamp)) { m.emissive.setRGB(...p.emission, THREE.SRGBColorSpace); m.emissiveIntensity = p.emissionIntensity * look.emissionScale; }
  return m;
});
const matCache = new Map();
const mat = (i, powered) => { const k = i + ':' + powered; if (!matCache.has(k)) matCache.set(k, mats[i](powered)); return matCache.get(k); };

function geometry(md) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(md.positions, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(md.normals, 3));
  // vertex colors are linear multipliers on the sRGB base color
  g.setAttribute('color', new THREE.Float32BufferAttribute(md.colors, 3));
  const idx = []; let start = 0;
  for (const grp of md.groups) { for (const v of grp.indices) idx.push(v); g.addGroup(start, grp.indices.length, grp.mat); start += grp.indices.length; }
  g.setIndex(idx);
  return g;
}
function mesh(md, powered) {
  const g = geometry(md);
  const materials = scene.palette.map((_, i) => mat(i, powered));
  const m = new THREE.Mesh(g, materials);
  m.castShadow = true; m.receiveShadow = true;
  // light cones must not cast shadows: split happens per group, so mark the whole mesh and rely on cone material depthWrite=false
  return m;
}

const t = +P.get('t') || 3.2;
// Unity-only scar look (BaseLook.json scarFx), mirrored so previews show what the game shows
const fx = Object.assign({ fireRate: 1, fireSize: 1, fireSpread: 1, fireBrightness: 1, smokeRate: 1, smokeSize: 1, smokeDark: 0, damageColor: [1, 0.12, 0.05], damageGlow: 2, damageTint: 0.12, damagePulseHz: 1.1 }, look.scarFx || {});
let lights = 0;
const cones = [];
for (const o of scene.objects) {
  const root = new THREE.Group();
  root.name = o.name;
  root.position.set(...o.position);
  root.rotation.y = o.yaw * Math.PI / 180;
  const md = scene.meshes[o.mesh];
  if (md.positions.length) root.add(mesh(md, o.powered));
  // damaged facility: Unity's pulsing red rim glow (_DsDamage, BaseView.DamageGlow), at this frame's pulse
  if (o.damage > 0 && md.positions.length) {
    const pulse = 0.5 + 0.5 * Math.sin(t * fx.damagePulseHz * Math.PI * 2);
    const k = fx.damageGlow * (0.4 + 0.3 * Math.min(3, o.damage)) * (0.25 + 0.75 * pulse);
    const glow = new THREE.Mesh(geometry(md), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, depthFunc: THREE.LessEqualDepth, blending: THREE.AdditiveBlending,
      uniforms: { col: { value: new THREE.Vector3(...fx.damageColor).multiplyScalar(k) }, tint: { value: fx.damageTint } },
      vertexShader: 'varying vec3 vn; varying vec3 vv; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); vv = normalize(-mv.xyz); vn = normalize(normalMatrix * normal); gl_Position = projectionMatrix * mv; }',
      fragmentShader: 'uniform vec3 col; uniform float tint; varying vec3 vn; varying vec3 vv; void main(){ float rim = 1.0 - clamp(dot(normalize(vn), normalize(vv)), 0.0, 1.0); gl_FragColor = vec4(col * (tint + rim * rim) * 0.18, 1.); }' }));
    glow.renderOrder = 5; root.add(glow);
  }
  if (o.cones >= 0 && o.powered && (look.coneIntensity ?? 0) > 0.005) { const c = new THREE.Mesh(geometry(scene.meshes[o.cones]), scene.palette.map((_, i) => mat(i, true))); c.castShadow = false; c.receiveShadow = false; c.renderOrder = 10; root.add(c); cones.push(c); }
  for (const p of o.parts) {
    const pivot = new THREE.Group(); pivot.position.set(...p.pivot);
    const pm = mesh(scene.meshes[p.mesh], o.powered);
    pivot.add(pm);
    if (o.powered) { if (p.kind === 3) pivot.rotation.z = (p.speed * t) * Math.PI / 180; else pivot.rotation.y = p.kind === 1 ? -(p.speed * t) * Math.PI / 180 : Math.sin(t * p.speed * Math.PI * 2) * p.range * Math.PI / 180; }
    root.add(pivot);
  }
  for (const l of o.lights) {
    const on = l.role === 0 || l.role === 3 || (l.role === 1 && o.powered) || (l.role === 2 && o.unmanned);
    if (!on || l.intensity <= 0) continue;
    const pl = new THREE.PointLight(new THREE.Color().setRGB(...l.color, THREE.SRGBColorSpace), l.intensity * look.pointScale, l.range * look.rangeScale, 2);
    pl.position.set(...l.pos); root.add(pl); lights++;
    if (l.role === 2) { const s = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(4, 2.4, 0.9) })); s.position.set(...l.pos); root.add(s); }
  }
  // battle scars (SPEC-018): static stand-ins for Unity's flame and smoke particles
  let fxSeed = o.name.length * 7.31;
  const rnd = () => { fxSeed = (fxSeed * 9301 + 49297) % 233280; return fxSeed / 233280; };
  for (const f of (o.fires || [])) {
    for (let k = 0; k < Math.round(7 * fx.fireRate); k++) {
      const hgt = (0.35 + rnd() * 0.7) * fx.fireSize, core = k < 2;
      const fl = new THREE.Mesh(new THREE.ConeGeometry((core ? 0.09 : 0.16 + rnd() * 0.1) * fx.fireSize, hgt, 8, 1, true),
        new THREE.MeshBasicMaterial({ color: core ? new THREE.Color(6, 4.2, 1.6) : new THREE.Color(4.5, 1.5, 0.35), transparent: true, opacity: (core ? 0.9 : 0.6) * fx.fireBrightness, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
      fl.position.set(f[0] + (rnd() - 0.5) * 0.35 * fx.fireSpread, f[1] + hgt * 0.5, f[2] + (rnd() - 0.5) * 0.3 * fx.fireSpread);
      fl.rotation.z = (rnd() - 0.5) * 0.35; fl.rotation.x = (rnd() - 0.5) * 0.3;
      root.add(fl);
    }
  }
  const lvl = o.smokeLevel || 0;
  for (const s of (lvl > 0 ? (o.smokes || []) : [])) {
    const puffs = Math.round((5 + lvl * 6) * fx.smokeRate), tone = new THREE.Color([0, 0x77736c, 0x3a3835, 0x161514][lvl]).multiplyScalar(1 - Math.min(1, fx.smokeDark));
    for (let k = 0; k < puffs; k++) {
      const u = k / puffs, r = (0.25 + u * (0.6 + lvl * 0.45)) * fx.smokeSize;
      const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 9), new THREE.MeshLambertMaterial({ color: tone, transparent: true, opacity: (0.55 + lvl * 0.1) * (1 - u * 0.85), depthWrite: false }));
      puff.position.set(s[0] + u * u * (2 + lvl) + (rnd() - 0.5) * 0.3 * (1 + u), s[1] + u * (3 + lvl * 2.2), s[2] + (rnd() - 0.5) * 0.4 * (1 + u));
      puff.castShadow = false; root.add(puff);
    }
  }
  world.add(root);
}

const cam = new THREE.PerspectiveCamera(look.fov, W / H, 1, 400);
// Close-up overrides for asset review: ?target=x,y,z (Unity space) &dist=N &az=deg.
const camTarget = P.get('target') ? P.get('target').split(',').map(Number) : null;
const camDist = +P.get('dist') || look.camDistance;
const ce = THREE.MathUtils.degToRad(look.camElevation), ca = THREE.MathUtils.degToRad(P.get('az') !== null ? +P.get('az') : look.camAzimuth);
const camAt = camTarget ? new THREE.Vector3(camTarget[0], camTarget[1], -camTarget[2]) : new THREE.Vector3(...look.camTarget);
const camFrom = camTarget ? camAt : new THREE.Vector3();
cam.position.set(camFrom.x + Math.cos(ce) * Math.sin(ca) * camDist, camFrom.y + Math.sin(ce) * camDist, camFrom.z + Math.cos(ce) * Math.cos(ca) * camDist);
cam.lookAt(camAt);

const composer = new EffectComposer(renderer);
composer.setSize(W, H);
composer.addPass(new RenderPass(world, cam));
const ao = new GTAOPass(world, cam, W, H); ao.updateGtaoMaterial({ radius: 1.2, distanceExponent: 1.5, thickness: 2, scale: 1.4 }); ao.blendIntensity = look.aoIntensity ?? 1.0; composer.addPass(ao);
// light cones are additive volumes, not surfaces: keep them out of the AO normal/depth pass (Unity: transparent queue)
{ const aoRender = ao.render.bind(ao); ao.render = (...a) => { for (const c of cones) c.visible = false; aoRender(...a); for (const c of cones) c.visible = true; }; }
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), look.bloomStrength, look.bloomRadius, look.bloomThreshold));
composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, grain: { value: look.grain }, vignette: { value: look.vignette }, ca: { value: look.chromatic } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float grain, vignette, ca; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){ vec2 d = vUv - .5; float r2 = dot(d,d);
      vec3 c = vec3(texture2D(tDiffuse, vUv + d * ca * r2).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - d * ca * r2).b);
      c += (h(vUv * 1000.) - .5) * grain; c *= 1. - vignette * smoothstep(.15, .75, r2 * 2.2);
      gl_FragColor = vec4(c, 1.); }`,
}));
// Graphic-novel grade for battle report stills (SPEC-006 rule 6). Mirrors Unity's DeadswitchNovel shader.
const novel = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, res: { value: new THREE.Vector2(W, H) }, ink: { value: 0.85 }, levels: { value: 4.0 }, dotSize: { value: 7.0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 res; uniform float ink, levels, dotSize; varying vec2 vUv;
    float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
    float L(vec2 o){ return luma(texture2D(tDiffuse, vUv + o / res).rgb); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb; float l = luma(c);
      float gx = -L(vec2(-1.,1.)) - 2.*L(vec2(-1.,0.)) - L(vec2(-1.,-1.)) + L(vec2(1.,1.)) + 2.*L(vec2(1.,0.)) + L(vec2(1.,-1.));
      float gy = -L(vec2(-1.,-1.)) - 2.*L(vec2(0.,-1.)) - L(vec2(1.,-1.)) + L(vec2(-1.,1.)) + 2.*L(vec2(0.,1.)) + L(vec2(1.,1.));
      float edge = smoothstep(0.10, 0.32, length(vec2(gx, gy)));
      float q = floor(pow(l, 0.8) * levels + 0.5) / levels;
      vec3 col = mix(vec3(q), c * (q / max(l, 0.002)), 0.42);
      vec2 hp = mat2(0.7071, -0.7071, 0.7071, 0.7071) * (vUv * res) / dotSize;
      float d = length(fract(hp) - 0.5);
      float shade = clamp(1.0 - l * 2.6, 0.0, 1.0);
      col *= 1.0 - 0.42 * step(d, shade * 0.6);
      float glow = smoothstep(0.75, 1.0, max(c.r, max(c.g, c.b)));
      col = mix(col, c * 1.15, glow * 0.7);
      col *= 1.0 - edge * ink;
      col = mix(col, col * vec3(1.04, 1.0, 0.9), 0.5);
      gl_FragColor = vec4(col, 1.);
    }`,
});
novel.enabled = false;
composer.addPass(novel);

if (scene.report && P.get('report')) {
  await renderReport(scene.report);
} else {
  composer.render();
}
window.__done = { lights };

async function renderReport(rep) {
  novel.enabled = true;
  renderer.toneMappingExposure = look.exposure * 1.45;
  const sizes = [[1000, 400], [492, 500], [492, 500], [1000, 400]];
  const imgs = [];
  for (let i = 0; i < rep.shots.length; i++) {
    const s = rep.shots[i], [w, h] = sizes[i];
    for (const r of world.children) if (r.name.startsWith('raider')) r.visible = r.name.startsWith('raider' + i + '_');
    renderer.setSize(w, h); composer.setSize(w, h); novel.uniforms.res.value.set(w, h);
    cam.aspect = w / h; cam.fov = s.fov; cam.position.set(...s.pos); cam.lookAt(new THREE.Vector3(...s.target)); cam.updateProjectionMatrix();
    composer.render();
    imgs.push(renderer.domElement.toDataURL('image/png'));
  }
  const panel = (i, cls) => `<div class="panel ${cls}"><img src="${imgs[i]}"><div class="cap">${rep.shots[i].caption}</div></div>`;
  document.body.innerHTML = `<style>
    @font-face { font-family: Chakra; src: url(/fonts/ChakraPetch-Bold.ttf); }
    @font-face { font-family: Plex; src: url(/fonts/IBMPlexMono-Regular.ttf); }
    @font-face { font-family: PlexSB; src: url(/fonts/IBMPlexMono-SemiBold.ttf); }
    body { margin: 0; width: ${W}px; height: ${H}px; background: #171B19; color: #D8D1BC; font-family: Plex; overflow: hidden; }
    .wrap { padding: 22px 40px; }
    .title { font-family: Chakra; font-size: 36px; letter-spacing: 4px; }
    .vector { font-family: PlexSB; font-size: 24px; color: #9DA197; margin: 8px 0 20px; letter-spacing: 1px; }
    .vector.bad { color: #E8B45C; }
    .grid { display: grid; grid-template-columns: 492px 492px; gap: 16px; }
    .panel { position: relative; border: 5px solid #0b0d0c; outline: 2px solid rgba(216,209,188,0.55); background: #000; }
    .panel img { display: block; width: 100%; }
    .wide { grid-column: 1 / span 2; }
    .cap { position: absolute; left: 12px; bottom: 12px; max-width: 78%; background: #D8D1BC; color: #111; font-family: PlexSB; font-size: 21px; line-height: 1.25; padding: 8px 12px; box-shadow: 4px 4px 0 #0b0d0c; }
    .wide .cap { bottom: auto; top: 12px; }
    .ai { margin-top: 16px; border: 1px solid rgba(168,213,138,0.32); background: rgba(8,11,9,0.72); padding: 16px 20px; }
    .lbl { font-family: Chakra; font-size: 20px; letter-spacing: 4px; color: #9DA197; display: flex; justify-content: space-between; }
    .chip { color: #E8B45C; border: 1px solid rgba(232,180,92,0.5); padding: 2px 10px; font-size: 18px; }
    .say { color: #A8D58A; font-size: 28px; margin-top: 10px; text-shadow: 0 0 10px rgba(168,213,138,0.35); }
    .ledger { margin-top: 16px; font-family: PlexSB; font-size: 28px; }
    .btn { margin-top: 16px; height: 104px; border: 2px solid #A8D58A; display: flex; align-items: center; justify-content: center; font-family: Chakra; font-size: 28px; letter-spacing: 4px; color: #A8D58A; background: rgba(168,213,138,0.08); }
  </style><div class="wrap">
    <div class="title">${rep.title}</div>
    <div class="vector ${rep.mismatch ? 'bad' : ''}">${rep.vector}</div>
    <div class="grid">${panel(0, 'wide')}${panel(1, '')}${panel(2, '')}${panel(3, 'wide')}</div>
    <div class="ai"><div class="lbl"><span>AI SUMMARY</span><span class="chip">UNVERIFIED</span></div><div class="say">&gt; ${rep.summary}</div></div>
    <div class="ai"><div class="lbl"><span>LOSS LEDGER</span><span>STORE COUNT</span></div><div class="ledger">${rep.ledger}</div></div>
    <div class="btn">VERIFY // 20 COMPUTE</div>
  </div>`;
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.decode()));
}
</script></body></html>
