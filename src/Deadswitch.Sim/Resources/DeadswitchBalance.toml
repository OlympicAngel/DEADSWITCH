# DEADSWITCH balance file
#
# Every tunable number in the simulation. 1 tick = 1 game minute. Integers only.
# Units are in the key names: _per_tick, _per_hour, _ticks, _pct (0-100), _permille (0-1000), _bp (0-10000).
# Each value shows its valid range in [min..max]. Edits are checked strictly by the tests and
# `dotnet run --project src/Deadswitch.Cli -- config check`. See docs/agents/balance-tuning.md.

# --------------------------------------------------------------------------------------------------
# Energy: continuous flow with upkeep (doc 02 s3, doc 10 s3). Generation comes from Generators.
[energy]

# Energy at the start of a run. [0..1000000]
start = 200

# Storage cap before Battery Banks. [1..1000000]
cap = 500

# AI core upkeep per game hour, paid before any facility. Unpaid = blackout. [0..1000000]
core_upkeep_per_hour = 240

# --------------------------------------------------------------------------------------------------
# Fuel: consumable for vehicles, raids, outposts and operations (doc 10 s3, s5).
[fuel]

# Fuel at the start of a run. [0..1000000]
start = 100

# Storage cap. [1..1000000]
cap = 300

# --------------------------------------------------------------------------------------------------
# Compute: the AI's processing power, produced by Server Racks (doc 02 s4).
[compute]

# Compute at the start of a run. [0..1000000]
start = 50

# Storage cap. [1..1000000]
cap = 100

# --------------------------------------------------------------------------------------------------
# People: scarce, slow-growing, can be lost (doc 02 s5, doc 10 s1.3).
[people]

# Population at the start of a run. [0..100000]
start = 12

# Tier 1 base population cap. [1..100000]
cap = 20

# Each hour, regain this percent of the gap to the cap (rounded up). Paused during blackouts. [0..100]
regrowth_pct_of_gap_per_hour = 5

# --------------------------------------------------------------------------------------------------
# Corruption: instability of the AI core, 0-100% stored as milli-units (doc 03 s3, doc 10 s3).
[corruption]

# Idle recovery per game hour (1000 = 1%). [0..100000]
decay_milli_per_hour = 1000

# Added per game hour for each unmanned (AI-run) facility. [0..100000]
automation_milli_per_hour = 150

# Band start (percent): Glitchy. [1..100]
glitchy_from = 31

# Band start (percent): Unstable. [1..100]
unstable_from = 61

# Band start (percent): Critical. [1..100]
critical_from = 86

# --------------------------------------------------------------------------------------------------
# Raids: fast, frequent, loot-focused attacks (doc 04 s3, doc 10 s4, SPEC-001).
[raid]

# A raid spawns each tick with chance 1 / this value. [1..1000000]
mean_interval_ticks = 360

# Attack cap per 24h (doc 10 s4: 3 in Tier 1). [0..100]
max_per_day = 3

# Warning before a spawned raid arrives. [0..10000]
warning_minutes = 20

# Strength floor of every raid. [0..1000000]
base_strength = 20

# Tall-poppy scaling: strength += coeff/1000 x power^exponent. [0..1000000]
power_coeff_permille = 1000

# Exponent on the power rating (doc 10: 0.7 = 700). [0..2000]
power_exponent_permille = 700

# Seeded variance on strength (doc 10: +/-15%). [0..100]
variance_pct = 15

# Energy share taken at a full breach. [0..100]
loot_pct_of_energy = 20

# Max energy one raid can take (never a full wipe). [0..1000000]
loot_cap = 60

# Compute share taken at a full breach. [0..100]
compute_loot_pct = 15

# Max compute one raid can take. [0..1000000]
compute_loot_cap = 30

# Max error of the AI's strength estimate per corruption band (Stable, Glitchy, Unstable, Critical). [4..4 items, each 0..100]
estimate_error_pct_by_band = [0, 15, 35, 60]

# No raids for this long after a devastating loss (doc 10 s4). [0..1000]
mercy_hours = 6

# Population loss in one raid that counts as devastating (doc 10: >25%). [1..100]
devastating_pop_loss_pct = 25

# --------------------------------------------------------------------------------------------------
# Hub layout: facility slots (SPEC-002).
[hub]

# Facility slots in the Tier 1 Hub. Slot 0 starts with a Generator, slot 1 with a Server Rack. [2..64]
slots = 6

# --------------------------------------------------------------------------------------------------
# Construction queue (SPEC-002 rule 4).
[build]

# Construction jobs that can run at the same time. [1..16]
queue_slots = 1

# Share of the paid cost returned when a job is cancelled. [0..100]
cancel_refund_pct = 50

# Share of the current level's cost returned when a facility is demolished. [0..100]
demolish_refund_pct = 25

# Diminishing returns: building another facility of a kind you already have costs +this percent per existing one. [0..1000]
duplicate_cost_pct = 100

# --------------------------------------------------------------------------------------------------
# Crewing: people run facilities; the AI runs the rest at reduced output (doc 02 s5).
[crew]

# Output of a short-handed facility run by the AI, in percent of full output. [0..100]
unmanned_output_pct = 50

# --------------------------------------------------------------------------------------------------
# OVERRIDE: limited charges, shared cooldown, corruption per use (doc 03 s6, doc 10 s3).
[override]

# Charges at the start of a run. [0..10]
start_charges = 1

# Maximum stored charges (v1: 3). [1..10]
max_charges = 3

# Game minutes per regenerated charge. [1..100000]
regen_minutes = 720

# Shared cooldown after any use. [0..100000]
cooldown_minutes = 30

# Corruption added per use (1000 = 1%). [0..100000]
corruption_milli_per_use = 8000

# --------------------------------------------------------------------------------------------------
# Defense setup: garrison slots and postures (doc 04 s5, doc 10 s4).
[defense]

# People that can be posted as defenders (doc 10: 3-5). [0..100]
garrison_slots = 5

# Defense each garrisoned person adds. [0..10000]
defense_per_defender = 4

# Turtle posture: extra defense in percent. [0..1000]
turtle_defense_pct = 50

# Dark posture: chance a raid fails to find the Hub. [0..100]
dark_miss_pct = 40

# Dark posture: extra energy per game hour (signal masking). [0..100000]
dark_upkeep_per_hour = 120

# Evacuate posture: loot multiplier in percent (no casualties). [0..1000]
evacuate_loot_pct = 150

# Share of the garrison lost at a full breach (scales with breach). [0..100]
casualty_pct = 50

# Raid strength multiplier when the handler is away with no posture and no garrison. [100..1000]
offline_unprepared_pct = 150

# --------------------------------------------------------------------------------------------------
# The AI's hidden dials, delegation and lies (SPEC-004). Dials are milli-units: 100000 = 100%. All (tune).
[ai]

# Boldness gained per game hour while the AI runs routines (Delegated). [0..100000]
boldness_per_hour_delegated = 300

# Boldness gained per game hour on offline autopilot. [0..100000]
boldness_per_hour_autopilot = 700

# Boldness lost per game hour while the handler runs everything (Manual). [0..100000]
boldness_decay_per_hour_manual = 100

# How often the delegated AI looks at the build queue (game minutes). [1..10000]
plan_every_minutes = 60

# Delegated AI builds power first while net energy per hour is below this. [0..100000]
plan_energy_margin = 150

# Autopilot turtles with the full garrison when its estimate exceeds defense x this %. [1..10000]
autopilot_turtle_pct = 100

# Autopilot evacuates when its estimate exceeds defense x this %. [1..10000]
autopilot_evacuate_pct = 200

# Raid number whose warning reports the wrong gate: the first lie (doc 10 s7.4). 0 disables it. [0..1000]
first_lie_raid = 2

# Chance per later raid warning that the reported gate is a lie, at 100% Boldness (scales linearly). [0..1000]
lie_chance_permille_at_full_boldness = 300

# --------------------------------------------------------------------------------------------------
# Battle reports: AI edits to the summary and the Verify tool (SPEC-006). All (tune).
[report]

# Chance the AI edits a breach summary while corruption is Unstable or worse. [0..100]
edit_chance_pct = 35

# An edited summary shows this % of the true energy loss. [0..100]
edit_shown_pct = 60

# Compute spent to verify one report against the sensor log. [0..100000]
verify_compute_cost = 20

# Reports kept (and verifiable) for the most recent raids. [1..100]
keep_raids = 10

# --------------------------------------------------------------------------------------------------
# The AI's hidden project clock, its clues, and the Audit (SPEC-007). Progress is milli-units: 100000 = 100%. All (tune).
[project]

# Project stage Active from this % (Dormant below). [1..100]
active_from = 25

# Project stage Advanced from this %. [1..100]
advanced_from = 55

# Project stage Imminent from this %. [1..100]
imminent_from = 85

# Project progress per game hour at 100% Boldness (scales linearly). [0..100000]
growth_per_hour_at_full_boldness = 250

# Project progress per compute point the AI skims. [0..100000]
milli_per_skimmed_compute = 8

# The AI skims compute while Boldness is at least this %. [0..100]
skim_from_boldness_pct = 30

# Share of each hour's compute output the AI skims. [0..100]
skim_pct = 15

# A bold AI (Boldness >= 50%) shows corruption this % lower than it is. [0..100]
underreport_pct = 30

# Compute spent per Audit. [0..100000]
audit_compute_cost = 60

# Game hours between Audits. [0..1000]
audit_cooldown_hours = 12

# --------------------------------------------------------------------------------------------------
# AI module research (SPEC-008). Lists follow the catalog order: M1, M2, M3, LG1, LG2A, LG2B, LG3, LG4, LG5A, LG5B, LG6. All (tune).
[modules]

# Energy cost per node. [11..11 items, each 0..100000]
research_energy = [450, 1200, 2400, 180, 300, 300, 600, 700, 650, 650, 900]

# Compute cost per node (compute caps at compute.cap). [11..11 items, each 0..100000]
research_compute = [90, 100, 100, 30, 60, 60, 80, 90, 80, 80, 100]

# Research time per node (game minutes). [11..11 items, each 1..100000]
research_minutes = [240, 600, 1440, 90, 150, 150, 240, 300, 300, 300, 420]

# Share of the cost returned when research is cancelled. [0..100]
cancel_refund_pct = 50

# LG1 Load Balancing: facility upkeep reduction in percent. [0..100]
load_balancing_pct = 10

# LG2A Overclocked Racks: Server Rack output bonus in percent. [0..1000]
overclock_pct = 25

# LG2B Deep Cells: Battery Bank capacity bonus in percent. [0..1000]
deep_cells_pct = 30

# LG3 Habitat Management: population cap bonus. [0..1000]
habitat_pop = 10

# LG4 Prefab Assembly: build time reduction in percent. [0..90]
prefab_pct = 25

# LG5A Salvage Doctrine: extra refund points on cancel and demolish. [0..100]
salvage_pts = 25

# LG5B Fuel Cells: Generator output bonus in percent. [0..1000]
fuel_cells_pct = 15

# LG6 Automation Protocols: output of unmanned facilities in percent. [0..100]
automation_unmanned_pct = 75

# --------------------------------------------------------------------------------------------------
# Hub tiers and tier-up gates (doc 06 s2, SPEC-008). All (tune).
[tier]

# Base population cap bonus per tier over people.cap (doc 10: 20 / 45 / 100 / 220). [4..4 items, each 0..10000]
pop_bonus = [0, 25, 80, 200]

# Build gate: total facility levels needed to leave tier 1 / 2 / 3. [3..3 items, each 0..1000]
levels_to_advance = [10, 25, 45]

# Build gate: net energy per hour needed to leave tier 1 / 2 / 3. [3..3 items, each -100000..100000]
net_energy_to_advance = [100, 300, 600]

# Human cost: people who leave to expand, before the size term. [3..3 items, each 0..1000]
people_cost_base = [4, 10, 20]

# Human cost: one more person per this many total facility levels. [1..1000]
people_cost_per_levels = 4

# --------------------------------------------------------------------------------------------------
# Opening of a run (SPEC-009): a scripted, beatable first raid and an early protection window. All (tune).
[opening]

# Play the opening raid and protection window in new runs. [true|false]
enabled = true

# Game minute the opening raid's warning appears. [1..100000]
raid_at_minute = 6

# Fixed strength of the opening raid (a Turtle garrison beats it). [1..100000]
raid_strength = 12

# No other raids before this game hour. [0..1000]
protection_hours = 10

# --------------------------------------------------------------------------------------------------
# The project's climax and counterplay (SPEC-011). All (tune).
[climax]

# Final warning window at Imminent, in game hours (doc 10: 24 real hours). [1..1000]
window_hours = 24

# Purge the core: energy cost (all compute is lost too). [0..100000]
purge_energy = 300

# Silence the AI (OVERRIDE): game hours the agenda stops and the AI goes quiet. [1..1000]
silence_hours = 48

# Cancel the project (after an Audit in the window): compute cost. [0..100000]
cancel_compute = 80

# Cancel the project: progress drops back to this %. [0..100]
cancel_to_pct = 55

# Betrayal: strength of the raid the AI lets in, in % of a normal raid (turrets stay offline for it). [100..1000]
betrayal_strength_pct = 250

# --------------------------------------------------------------------------------------------------
# Ruthless choices and loyalty (SPEC-012). Loyalty and Coldness are milli-units: 100000 = 100%. All (tune).
[people_choices]

# Loyalty under this % is Strained. [1..100]
strained_below = 60

# Loyalty under this % is Mutinous. [0..100]
mutinous_below = 30

# Loyalty regained per game hour while no surge runs. [0..100000]
recover_per_hour = 400

# Generator and Server Rack output lost while Strained (points). [0..100]
strained_output_pts = 10

# Generator and Server Rack output lost while Mutinous (points). [0..100]
mutinous_output_pts = 25

# No choice or event takes the population below this. [1..1000]
min_people = 4

# Forced labor surge: people who die at once. [0..100]
surge_deaths = 2

# Forced labor surge: game hours of boosted output. [1..1000]
surge_hours = 6

# Forced labor surge: Generator and Server Rack output bonus (points). [0..1000]
surge_output_pts = 40

# Forced labor surge: loyalty lost. [0..100000]
surge_loyalty = 20000

# Forced labor surge: Coldness gained. [0..100000]
surge_coldness = 15000

# Forced labor surge: game hours before the next one. [0..1000]
surge_cooldown_hours = 24

# Neural cleansing: most people used at once. [1..100]
cleanse_max = 5

# Neural cleansing: corruption removed per person (milli). [0..100000]
cleanse_per_person = 8000

# Neural cleansing: loyalty lost per person. [0..100000]
cleanse_loyalty = 5000

# Neural cleansing: Coldness gained per person. [0..100000]
cleanse_coldness = 6000

# Crackdown: people removed. [0..100]
crackdown_people = 2

# Crackdown: loyalty restored (fear). [0..100000]
crackdown_loyalty = 25000

# Crackdown: Coldness gained. [0..100000]
crackdown_coldness = 20000

# Daily chance an operator goes rogue while Mutinous. [0..100]
rogue_chance_pct = 35

# Energy a rogue operator takes. [0..100000]
rogue_energy = 80

# --------------------------------------------------------------------------------------------------
# Host timing: offline catch-up and saving (ADR-0004). Real time: 1 tick = 1 real minute.
[host]

# Offline time simulated on return is capped here (never grants unlimited progress). [1..10000]
max_catch_up_hours = 168

# A device clock that moved backwards by more than this raises a time desync. [0..10000]
desync_tolerance_minutes = 5

# Real seconds between autosaves while playing. [5..3600]
autosave_seconds = 60

# Game hours the logout projection runs ahead to schedule notifications (SPEC-010). [1..168]
notify_project_hours = 24

# Most local notifications scheduled per logout. [0..64]
notify_max = 6

