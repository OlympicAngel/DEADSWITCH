# DEADSWITCH balance file
#
# Every tunable number in the simulation. 1 tick = 1 game minute. Integers only.
# Units are in the key names: _per_tick, _per_hour, _ticks, _pct (0-100), _permille (0-1000), _bp (0-10000).
# Each value shows its valid range in [min..max]. Edits are checked strictly by the tests and
# `dotnet run --project src/Deadswitch.Cli -- config check`. See docs/agents/balance-tuning.md.

# --------------------------------------------------------------------------------------------------
# Energy: continuous flow with upkeep (doc 02 s3, doc 10 s3). Generation comes from Generators.
[energy]

# Energy at the start of a run. [0..1000000]
start = 200

# Storage cap before Battery Banks. [1..1000000]
cap = 500

# AI core upkeep per game hour, paid before any facility. Unpaid = blackout. [0..1000000]
core_upkeep_per_hour = 240

# --------------------------------------------------------------------------------------------------
# Fuel: consumable for vehicles, raids, outposts and operations (doc 10 s3, s5).
[fuel]

# Fuel at the start of a run. [0..1000000]
start = 100

# Storage cap. [1..1000000]
cap = 300

# --------------------------------------------------------------------------------------------------
# Compute: the AI's processing power, produced by Server Racks (doc 02 s4).
[compute]

# Compute at the start of a run. [0..1000000]
start = 50

# Storage cap. [1..1000000]
cap = 100

# --------------------------------------------------------------------------------------------------
# People: scarce, slow-growing, can be lost (doc 02 s5, doc 10 s1.3).
[people]

# Population at the start of a run. [0..100000]
start = 12

# Tier 1 base population cap. [1..100000]
cap = 20

# Each hour, regain this percent of the gap to the cap (rounded up). Paused during blackouts. [0..100]
regrowth_pct_of_gap_per_hour = 5

# --------------------------------------------------------------------------------------------------
# Corruption: instability of the AI core (doc 03 s3, doc 10 s3).
[corruption]

# Maximum corruption. [1..1000]
cap = 100

# Idle recovery per hour. [0..1000]
decay_per_hour = 1

# --------------------------------------------------------------------------------------------------
# Raids: fast, frequent, loot-focused attacks (doc 04 s3, doc 10 s4).
[raid]

# A raid triggers each tick with chance 1 / this value. [1..1000000]
mean_interval_ticks = 360

# Share of current energy a raid takes. [0..100]
loot_pct_of_energy = 20

# Maximum energy a single raid can take (never a full wipe). [0..1000000]
loot_cap = 60

# Offline attack cap per 24h (doc 10 s4: 3 in Tier 1). [0..100]
max_per_day = 3

# --------------------------------------------------------------------------------------------------
# Hub layout: facility slots (SPEC-002).
[hub]

# Facility slots in the Tier 1 Hub. Slot 0 starts with a Generator, slot 1 with a Server Rack. [2..64]
slots = 6

# --------------------------------------------------------------------------------------------------
# Construction queue (SPEC-002 rule 4).
[build]

# Construction jobs that can run at the same time. [1..16]
queue_slots = 1

# Share of the paid cost returned when a job is cancelled. [0..100]
cancel_refund_pct = 50

# Share of the current level's cost returned when a facility is demolished. [0..100]
demolish_refund_pct = 25

# Diminishing returns: building another facility of a kind you already have costs +this percent per existing one. [0..1000]
duplicate_cost_pct = 100

# --------------------------------------------------------------------------------------------------
# Crewing: people run facilities; the AI runs the rest at reduced output (doc 02 s5).
[crew]

# Output of a short-handed facility run by the AI, in percent of full output. [0..100]
unmanned_output_pct = 50

# --------------------------------------------------------------------------------------------------
# Generator: scavenged power plant. Output = energy per game hour.
[facility_generator]

# Energy paid up front to build (level 1) or upgrade to each level. [1..20 items, each 0..1000000]
cost_energy = [300, 260, 450, 780, 1350]

# Compute paid up front per level. [1..20 items, each 0..1000000]
cost_compute = [0, 0, 10, 25, 50]

# Construction time per level in game minutes (ticks). [1..20 items, each 1..1000000]
build_minutes = [30, 45, 90, 180, 360]

# Energy upkeep per game hour while powered, per level. [1..20 items, each 0..1000000]
upkeep_per_hour = [0, 0, 0, 0, 0]

# Energy generated per game hour, per level. [1..20 items, each 0..1000000]
output = [480, 660, 900, 1200, 1560]

# People needed to run the facility at full output, per level. [1..20 items, each 0..1000]
crew = [2, 2, 3, 3, 4]

# --------------------------------------------------------------------------------------------------
# Server Rack: burns energy to produce compute for the AI (doc 02 s4). Output = compute per game hour.
[facility_server_rack]

# Energy paid up front to build (level 1) or upgrade to each level. [1..20 items, each 0..1000000]
cost_energy = [120, 220, 400, 700, 1200]

# Compute paid up front per level. [1..20 items, each 0..1000000]
cost_compute = [0, 15, 30, 60, 100]

# Construction time per level in game minutes (ticks). [1..20 items, each 1..1000000]
build_minutes = [15, 40, 80, 160, 320]

# Energy upkeep per game hour while powered, per level. [1..20 items, each 0..1000000]
upkeep_per_hour = [180, 300, 450, 660, 930]

# Compute produced per game hour, per level. [1..20 items, each 0..1000000]
output = [60, 100, 150, 210, 280]

# People needed to run the facility at full output, per level. [1..20 items, each 0..1000]
crew = [1, 1, 2, 2, 3]

# --------------------------------------------------------------------------------------------------
# Life Support Grid: raises the population cap while powered (doc 10 s1.3).
[facility_life_support]

# Energy paid up front to build (level 1) or upgrade to each level. [1..20 items, each 0..1000000]
cost_energy = [200, 340, 560, 900, 1400]

# Compute paid up front per level. [1..20 items, each 0..1000000]
cost_compute = [0, 10, 20, 40, 70]

# Construction time per level in game minutes (ticks). [1..20 items, each 1..1000000]
build_minutes = [60, 120, 240, 420, 720]

# Energy upkeep per game hour while powered, per level. [1..20 items, each 0..1000000]
upkeep_per_hour = [120, 210, 330, 480, 660]

# Population cap bonus per level. [1..20 items, each 0..1000000]
output = [6, 12, 20, 30, 42]

# People needed to run the facility at full output, per level. [1..20 items, each 0..1000]
crew = [1, 2, 2, 3, 3]

# --------------------------------------------------------------------------------------------------
# Battery Bank: raises the energy storage cap while powered.
[facility_battery_bank]

# Energy paid up front to build (level 1) or upgrade to each level. [1..20 items, each 0..1000000]
cost_energy = [100, 200, 380, 650, 1050]

# Compute paid up front per level. [1..20 items, each 0..1000000]
cost_compute = [0, 0, 10, 20, 40]

# Construction time per level in game minutes (ticks). [1..20 items, each 1..1000000]
build_minutes = [15, 40, 80, 150, 300]

# Energy upkeep per game hour while powered, per level. [1..20 items, each 0..1000000]
upkeep_per_hour = [0, 0, 30, 60, 120]

# Energy cap bonus per level. [1..20 items, each 0..1000000]
output = [250, 600, 1100, 1800, 2800]

# People needed to run the facility at full output, per level. [1..20 items, each 0..1000]
crew = [0, 0, 1, 1, 1]
