name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python3 tools/gen_meta.py --check
      - run: dotnet restore DEADSWITCH.sln
      - run: dotnet format DEADSWITCH.sln --verify-no-changes --severity warn --no-restore
      - run: dotnet build DEADSWITCH.sln -c Release --no-restore -warnaserror
      - run: dotnet build tools/UnityCompileCheck -c Release -warnaserror
      - run: dotnet test DEADSWITCH.sln -c Release --no-build --logger "trx;LogFileName=test.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
