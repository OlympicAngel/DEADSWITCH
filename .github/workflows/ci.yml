name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore DEADSWITCH.sln
      # Non-blocking until the codebase has been formatted once; then remove continue-on-error.
      - run: dotnet format DEADSWITCH.sln --verify-no-changes --severity warn --no-restore
        continue-on-error: true
      - run: dotnet build DEADSWITCH.sln -c Release --no-restore -warnaserror
      - run: dotnet test DEADSWITCH.sln -c Release --no-build
