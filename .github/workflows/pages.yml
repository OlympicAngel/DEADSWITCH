name: Smoke test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The whole check: open the page in a headless browser and fail on anything it throws.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run smoke

  # Uploading and deploying are separate jobs on purpose: the artifact API needs a moment to index an
  # upload before deploy-pages can find it, and re-running only the deploy job never uploads a second
  # artifact (two of them in one run fail the deployment).
  build:
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: mkdir _site && cp -r index.html .nojekyll manifest.webmanifest sw.js icon.svg icons css js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
