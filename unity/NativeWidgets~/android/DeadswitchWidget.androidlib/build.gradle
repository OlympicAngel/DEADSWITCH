apply plugin: 'com.android.library'

android {
    namespace 'com.deadswitch.widget'
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 23
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['res']
        }
    }
}
